<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="200" cy="200" r="180" fill="#FAFAF7" stroke="#1E3A8A" stroke-width="2" />

  <!-- Academic Shield -->
  <path d="M 200 45 C 280 45 320 60 320 120 C 320 220 260 295 200 335 C 140 295 80 220 80 120 C 80 60 120 45 200 45 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)" />
  
  <!-- Inner Shield Border -->
  <path d="M 200 55 C 270 55 308 68 308 122 C 308 212 254 282 200 320 C 146 282 92 212 92 122 C 92 68 130 55 200 55 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.8" />

  <!-- Rising Sun (Gyan / Illumination) -->
  <path d="M 140 180 A 60 60 0 0 1 260 180 Z" fill="url(#sunGrad)" />
  <!-- Sun Rays -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round">
    <line x1="200" y1="110" x2="200" y2="92" />
    <line x1="170" y1="118" x2="160" y2="102" />
    <line x1="230" y1="118" x2="240" y2="102" />
    <line x1="145" y1="138" x2="130" y2="128" />
    <line x1="255" y1="138" x2="270" y2="128" />
    <line x1="130" y1="165" x2="114" y2="160" />
    <line x1="270" y1="165" x2="286" y2="160" />
  </g>

  <!-- Open Book of Knowledge -->
  <g transform="translate(200, 205)">
    <!-- Book Spine & Pages Shadow -->
    <path d="M 0 0 C 35 -15 70 -10 90 5 L 90 45 C 70 30 35 25 0 40 C -35 25 -70 30 -90 45 L -90 5 C -70 -10 -35 -15 0 0 Z" 
          fill="#FFFFFF" filter="url(#shadow)" />
    <!-- Page Folds -->
    <path d="M 0 0 C 35 -15 70 -10 90 5 L 90 10 C 70 -5 35 -10 0 5 C -35 -10 -70 -5 -90 10 L -90 5 C -70 -10 -35 -15 0 0 Z" 
          fill="#FDE68A" />
    <!-- Book Spine Center -->
    <line x1="0" y1="0" x2="0" y2="40" stroke="#1E3A8A" stroke-width="3" />
    <!-- Text Lines Left Page -->
    <line x1="-75" y1="15" x2="-20" y2="10" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-75" y1="23" x2="-20" y2="18" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-75" y1="31" x2="-35" y2="26" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Text Lines Right Page -->
    <line x1="20" y1="10" x2="75" y2="15" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="18" x2="75" y2="23" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20" y1="26" x2="60" y2="31" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Torch / Flame of Enlightenment at center top -->
  <path d="M 200 135 C 193 145 190 155 196 165 C 200 170 204 167 205 163 C 208 170 216 166 215 158 C 213 146 205 140 200 135 Z" 
        fill="url(#goldGrad)" />

  <!-- Laurel Wreath Leaves (Left & Right) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <!-- Left Laurel -->
    <ellipse cx="112" cy="190" rx="9" ry="5" transform="rotate(-35 112 190)" />
    <ellipse cx="116" cy="220" rx="9" ry="5" transform="rotate(-20 116 220)" />
    <ellipse cx="126" cy="250" rx="9" ry="5" transform="rotate(-5 126 250)" />
    <ellipse cx="145" cy="276" rx="9" ry="5" transform="rotate(15 145 276)" />
    <ellipse cx="170" cy="296" rx="9" ry="5" transform="rotate(35 170 296)" />
    <!-- Right Laurel -->
    <ellipse cx="288" cy="190" rx="9" ry="5" transform="rotate(35 288 190)" />
    <ellipse cx="284" cy="220" rx="9" ry="5" transform="rotate(20 284 220)" />
    <ellipse cx="274" cy="250" rx="9" ry="5" transform="rotate(5 274 250)" />
    <ellipse cx="255" cy="276" rx="9" ry="5" transform="rotate(-15 255 276)" />
    <ellipse cx="230" cy="296" rx="9" ry="5" transform="rotate(-35 230 296)" />
  </g>

  <!-- Banner at Bottom -->
  <path d="M 85 320 C 130 310 270 310 315 320 L 305 350 C 265 342 135 342 95 350 Z" 
        fill="url(#goldGrad)" filter="url(#shadow)" />
  <text x="200" y="338" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" 
        fill="#0F172A" text-anchor="middle" letter-spacing="3">KALAJHARIA</text>

  <!-- Circular Arch Text -->
  <path id="textPathArch" d="M 45 200 A 155 155 0 0 1 355 200" fill="none" />
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#1E3A8A" letter-spacing="4">
    <textPath href="#textPathArch" startOffset="50%" text-anchor="middle">
      GYAN STHALI PUBLIC SCHOOL
    </textPath>
  </text>
  
  <!-- Motto Bottom Arch -->
  <path id="mottoPathArch" d="M 80 230 A 155 155 0 0 0 320 230" fill="none" />
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="2">
    <textPath href="#mottoPathArch" startOffset="50%" text-anchor="middle">
      KNOWLEDGE • CHARACTER • EXCELLENCE
    </textPath>
  </text>
</svg>
